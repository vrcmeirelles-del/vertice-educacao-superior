name: Evidencias - extracao e busca com escopo
on:
  pull_request:
    paths:
      - 'supabase/functions/vertice-doc-prevalidate/**'
      - 'supabase/functions/vertice-doc-analyze/**'
      - 'supabase/migrations/*documentary_rules_reliability.sql'
      - 'scripts/evaluate-document-rules.mjs'
      - 'supabase/migrations/*evidence_text_index.sql'
      - 'supabase/migrations/*official_reference_catalog.sql'
      - 'supabase/migrations/*repository_index_queue.sql'
      - 'supabase/migrations/*extraction_failure_trace.sql'
      - 'supabase/migrations/*ocr_provenance_notice.sql'
      - 'docs/enade-360/fontes/iacg2017-reconhecimento-catalog.json'
      - 'supabase/migrations*/*instrumentos_catalogos.sql'
      - 'scripts/instrumentos/**'
      - 'source-overrides/client/src/lib/avaliacao-institucional.json'
      - 'source-overrides/client/src/lib/novo-instrumento.ts'
      - 'source-overrides/client/src/lib/instrumento-mapping.ts'
      - 'scripts/tests/evidence-runtime/**'
      - '.github/workflows/verify-evidence-index.yml'
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: scripts/tests/evidence-runtime
      - run: node --test scripts/tests/evidence-runtime/*.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verificar funcao existente e dependencias reais
        run: deno check --no-config supabase/functions/vertice-doc-prevalidate/index.ts
      - name: Executar parser PDF real em Deno sem bibliotecas nativas
        run: deno test --no-config --allow-read --allow-env --allow-sys --deny-ffi scripts/tests/evidence-runtime/pdf-edge.test.ts
