name: ENADE 360 - Contract Tests
on:
  pull_request:
    paths:
      - "docs/enade-360/validator/**"
      - ".github/workflows/enade360-contracts.yml"
  workflow_dispatch:
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JSON Schema validator
        run: python -m pip install "jsonschema==4.23.0"
      - name: Run synthetic semantic contract tests
        run: node docs/enade-360/validator/test-contracts.cjs
      - name: Validate positive and negative Draft 2020-12 instances
        run: python docs/enade-360/validator/test-json-schema.py
