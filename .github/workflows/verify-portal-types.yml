name: Portal - TypeScript completo e contratos da Reitoria
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/vertice-discursiva/**'
      - 'supabase/functions/_shared/**'
      - 'supabase/functions/vertice-communications/**'
      - 'supabase/functions/vertice-convite*/**'
      - 'supabase/functions/vertice-extension-student-invite/**'
      - 'supabase/functions/vertice-student-portal/**'
      - 'supabase/functions/vertice-notify-students/**'
      - 'supabase/functions/send-contract-confirmation/**'
      - 'supabase/migrations/*portal_communications.sql'
      - 'supabase/migrations/*discursiva*.sql'
      - 'scripts/tests/discursiva-runtime/**'
      - 'source-overrides/shared/**'
      - 'source-overrides/client/**'
      - 'source-overrides/server/**'
      - 'source-overrides/tsconfig.json'
      - 'source-overrides/package*.json'
      - 'source-overrides/supabase/functions/vertice-sapiens-analyze/**'
      - 'supabase/migrations/*planning*.sql'
      - 'supabase/migrations/*school_operations*.sql'
      - 'supabase/migrations/*integration_observations.sql'
      - 'supabase/migrations/*extension_electronic_forms.sql'
      - 'supabase/migrations/*tcc*.sql'
      - 'supabase/migrations/*internship*.sql'
      - 'scripts/extension.vitest.config.ts'
      - 'scripts/tests/extension-runtime/**'
      - 'vertice-servidor-source.zip'
      - 'scripts/portal-types.vitest.config.ts'
      - 'scripts/tests/types-runtime/**'
      - 'scripts/tests/planning-runtime/**'
      - 'scripts/compare-typescript-diagnostics.mjs'
      - 'scripts/tests/typescript-diagnostics.test.mjs'
      - '.github/workflows/verify-portal-types.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 0 }}
  cancel-in-progress: true

jobs:
  portal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            source-overrides/package-lock.json
            scripts/tests/**/package-lock.json
      - name: Compor o portal como os serviços atuais
        run: |
          mkdir -p .typecheck-build
          unzip -qo vertice-servidor-source.zip -d .typecheck-build
          mkdir -p .typecheck-build/supabase/functions
          cp -a supabase/functions/. .typecheck-build/supabase/functions/
          cp -a source-overrides/. .typecheck-build/
          cp scripts/portal-types.vitest.config.ts scripts/extension.vitest.config.ts .typecheck-build/scripts/
      - name: Instalar dependências com lockfile
        run: |
          npm ci --prefix .typecheck-build --legacy-peer-deps --no-audit --no-fund
          npm ci --prefix scripts/tests/types-runtime --no-audit --no-fund
          ln -s "$GITHUB_WORKSPACE/scripts/tests/types-runtime/node_modules/jsdom" .typecheck-build/node_modules/jsdom
      - name: Testar permissões e conclusão dos formulários de extensão
        run: |
          npm ci --prefix scripts/tests/extension-runtime --no-audit --no-fund
          node --test --test-concurrency=1 scripts/tests/extension-runtime/*.test.mjs
      - name: Testar o bloqueio de regressões do compilador
        run: node --test scripts/tests/typescript-diagnostics.test.mjs
      - name: Testar autorização, contexto e rastreabilidade do planejamento em PostgreSQL
        if: matrix.node == '24'
        run: |
          npm ci --prefix scripts/tests/planning-runtime --no-audit --no-fund
          node --test scripts/tests/planning-runtime/*.test.mjs
      - name: Discursiva — rubricas, QR, permissões e ciclo PostgreSQL
        if: matrix.node == '24'
        run: |
          npm ci --prefix scripts/tests/discursiva-runtime --no-audit --no-fund
          node --test scripts/tests/discursiva-runtime/*.test.mjs
      - name: TypeScript completo, sem tolerar erros da base
        working-directory: .typecheck-build
        run: npm run check
      - name: Suíte existente e regressões dos contratos
        working-directory: .typecheck-build
        run: |
          npm test
          ./node_modules/.bin/vitest run --config scripts/portal-types.vitest.config.ts
          ./node_modules/.bin/vitest run --config scripts/extension.vitest.config.ts
          ./node_modules/.bin/vitest run --config vitest.conecta.config.ts
      - name: Build estático completo
        working-directory: .typecheck-build
        run: npm run build:static
