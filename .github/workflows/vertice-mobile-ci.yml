name: Vértice Mobile — build de homologação
on:
  push:
    branches:
      - feat/vertice-mobile-bi-20261106
      - feat/mobile-preview-reitor-sem-login-20261106
      - fix/primeira-matricula-todos-cursos-20261107
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build_mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar fonte original com sobreposições do projeto
        shell: bash
        run: |
          mkdir -p .ci-build
          unzip -qo vertice-servidor-source.zip -d .ci-build
          cp -a source-overrides/. .ci-build/
          test -f .ci-build/package.json
          test -f .ci-build/client/src/components/bi/VerticeMobileBI.tsx
          test -f .ci-build/client/src/components/bi/VerticeMobilePublicPreview.tsx
          test -f .ci-build/client/src/components/bi/PrimeiraMatriculaTodosCursos.tsx
      - name: Dependências bloqueadas pelo lockfile
        working-directory: .ci-build
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Preparar referência da branch principal
        uses: actions/checkout@v4
        with:
          ref: main
          path: .ci-main-source
      - name: Montar fonte de referência
        shell: bash
        run: |
          mkdir -p .ci-base
          unzip -qo .ci-main-source/vertice-servidor-source.zip -d .ci-base
          cp -a .ci-main-source/source-overrides/. .ci-base/
          ln -s "$PWD/.ci-build/node_modules" .ci-base/node_modules
      - name: Comparar erros TypeScript com a branch principal
        shell: bash
        run: |
          set +e
          (cd .ci-base && ../.ci-build/node_modules/.bin/tsc --noEmit) > typecheck-base.log 2>&1
          base_rc=$?
          (cd .ci-build && npm run check) > typecheck-mobile.log 2>&1
          mobile_rc=$?
          set -e
          # Compare diagnostics by file, TS code and message rather than volatile line numbers.
          # Fixing existing diagnostics is allowed; only new diagnostics fail the branch.
          grep -E 'error TS[0-9]+:' typecheck-base.log | sed -E 's/\\([0-9]+,[0-9]+\\):/(__line__):/' | sort -u > typecheck-base-errors.txt || true
          grep -E 'error TS[0-9]+:' typecheck-mobile.log | sed -E 's/\\([0-9]+,[0-9]+\\):/(__line__):/' | sort -u > typecheck-mobile-errors.txt || true
          echo "TypeScript base exit: $base_rc; mobile exit: $mobile_rc"
          echo "Erros distintos pré-existentes: $(wc -l < typecheck-base-errors.txt)"
          echo "Erros distintos da branch: $(wc -l < typecheck-mobile-errors.txt)"
          comm -13 typecheck-base-errors.txt typecheck-mobile-errors.txt > typecheck-new-errors.txt
          if [ -s typecheck-new-errors.txt ]; then
            cat typecheck-new-errors.txt
            echo "::error::A branch acrescentou erros TypeScript não presentes na main."
            exit 1
          fi
          if [ "$mobile_rc" -ne 0 ]; then
            echo "::warning::A checagem global da main já contém erros TypeScript; o Mobile não acrescentou novos erros."
          fi
      - name: Testes existentes
        id: tests
        continue-on-error: true
        working-directory: .ci-build
        run: npm test
      - name: Build estático
        working-directory: .ci-build
        run: npm run build:static
      - name: Conferir artefatos do PWA
        working-directory: .ci-build
        shell: bash
        run: |
          test -f dist/public/index.html
          test -f dist/public/vertice-mobile.webmanifest
          test -f dist/public/mobile-icon.svg
          test -f dist/public/mobile-icon-192.png
          test -f dist/public/mobile-icon-512.png
          test -f dist/public/mobile-sw.js
          grep -q 'vertice-mobile.webmanifest' dist/public/index.html

      - name: Não aprovar homologação se testes falharam
        if: ${{ steps.tests.outcome == 'failure' }}
        run: |
          echo "::error::A suite existente falhou. Build não substitui homologação funcional."
          exit 1
