name: Validar BI permanência e reprovações
on:
  pull_request:
    paths:
      - 'source-overrides/**'
      - 'vertice-servidor-source.zip'
      - '.github/workflows/verify-academic-bi.yml'
  workflow_dispatch:
    inputs:
      institution_contracts_only:
        description: 'Executar somente contratos institucionais em PostgreSQL efêmero (sem produção)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  validation:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.institution_contracts_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extrair fonte editável e aplicar overrides
        run: |
          test -f vertice-servidor-source.zip
          mkdir -p .validation-build
          unzip -qo vertice-servidor-source.zip -d .validation-build
          cp -a source-overrides/. .validation-build/
          if [ -d supabase ]; then cp -a supabase .validation-build/; fi
          test -f .validation-build/package.json
          test -f .validation-build/client/src/components/bi/AuditoriaPermanenciaBI.tsx
      - name: Instalar dependências exatas
        working-directory: .validation-build
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Preparar base TypeScript da main
        uses: actions/checkout@v4
        with:
          ref: main
          path: .validation-main-source
      - name: Bloquear novos erros TypeScript em relação à main
        shell: bash
        run: |
          mkdir -p .validation-main-build
          unzip -qo .validation-main-source/vertice-servidor-source.zip -d .validation-main-build
          cp -a .validation-main-source/source-overrides/. .validation-main-build/
          if [ -d .validation-main-source/supabase ]; then cp -a .validation-main-source/supabase .validation-main-build/; fi
          ln -s "$PWD/.validation-build/node_modules" .validation-main-build/node_modules
          set +e
          (cd .validation-main-build && ../.validation-build/node_modules/.bin/tsc --noEmit) > /tmp/vertice-ts-main.log 2>&1
          (cd .validation-build && npm run check) > /tmp/vertice-ts-branch.log 2>&1
          set -e
          grep -E 'error TS[0-9]+:' /tmp/vertice-ts-main.log | sed -E 's/\\([0-9]+,[0-9]+\\):/(__line__):/' | sort -u > /tmp/vertice-ts-base.txt || true
          grep -E 'error TS[0-9]+:' /tmp/vertice-ts-branch.log | sed -E 's/\\([0-9]+,[0-9]+\\):/(__line__):/' | sort -u > /tmp/vertice-ts-feature.txt || true
          comm -13 /tmp/vertice-ts-base.txt /tmp/vertice-ts-feature.txt > /tmp/vertice-ts-new.txt
          if [ -s /tmp/vertice-ts-new.txt ]; then
            cat /tmp/vertice-ts-new.txt
            echo "::error::Há erros TypeScript introduzidos por esta alteração."
            exit 1
          fi
          if [ -s /tmp/vertice-ts-feature.txt ]; then
            echo "::warning::Persistem erros TypeScript legados na main; nenhum erro novo foi introduzido."
          fi
      - name: Testes
        working-directory: .validation-build
        run: npm test
      - name: Build estático
        working-directory: .validation-build
        run: npm run build:static
      - name: Verificar saída
        run: |
          test -f .validation-build/dist/public/index.html

  institution-multisession:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.institution_contracts_only) || (github.event_name == 'pull_request' && github.head_ref == 'test/institution-postgres-concurrency-20261112') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: institution-multisession-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependências de teste fixadas
        run: npm ci --prefix scripts/tests/runtime --no-audit --no-fund
      - name: PostgreSQL 17 local no runner efêmero
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x /usr/lib/postgresql/17/bin/initdb ]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends postgresql-common ca-certificates
            # Official PostgreSQL packaging helper; no database/project credentials.
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends postgresql-17 postgresql-client-17
          fi
          test -x /usr/lib/postgresql/17/bin/initdb
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/postgres --version
      - name: Governança - duas sessões, identidade da ação e vínculo
        shell: bash
        run: |
          set -euo pipefail
          unset PGHOST PGHOSTADDR PGPORT PGDATABASE PGUSER PGPASSWORD PGPASSFILE PGOPTIONS PGSERVICE PGSERVICEFILE
          bash scripts/tests/governance-concurrency.sh
      - name: Egressos e Extensão - acesso, duas sessões e rollback
        shell: bash
        env:
          PG_MODULE: ${{ github.workspace }}/scripts/tests/runtime/node_modules/pg/lib/index.js
        run: |
          set -euo pipefail
          unset PGHOST PGHOSTADDR PGPORT PGDATABASE PGUSER PGPASSWORD PGPASSFILE PGOPTIONS PGSERVICE PGSERVICEFILE
          bash scripts/tests/alumni-access-local-postgres.sh
      - name: Registrar escopo sem sessões, chaves ou artefatos de banco
        if: always()
        shell: bash
        run: |
          printf '%s\n' '## PostgreSQL efêmero' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Commit testado: '${GITHUB_SHA} >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Os scripts criam clusters próprios Unix-only e bases vazias; seus traps encerram e removem os dados sintéticos.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Ausência de binário (exit 77), erro de socket ou teste falho NÃO contam como gate aprovado.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Não há conexão Supabase/Render de produção, secrets do repositório ou autorização de aplicar SQL remotamente.' >> "$GITHUB_STEP_SUMMARY"
