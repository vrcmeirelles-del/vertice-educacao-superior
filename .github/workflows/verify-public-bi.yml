name: Verificar BI público da Vértice
on:
  push:
    branches: [main, fix/bi-public-access-20261108]
    paths:
      - ".github/workflows/verify-public-bi.yml"
      - "source-overrides/client/src/pages/public/PremiumBIPublic.tsx"
      - "source-overrides/client/src/PublicApp.tsx"
      - "source-overrides/client/src/App.tsx"
      - "source-overrides/client/src/pages/public/CommercialDemo.tsx"
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Confirmar rota no React e no gerador de páginas estáticas
        run: |
          grep -Fq '"/bi-demonstrativo": PremiumBIPublic' source-overrides/client/src/PublicApp.tsx
          grep -Fq '"bi-demonstrativo",' source-overrides/scripts/prerender.tsx
          grep -Fq 'Abrir o BI Premium interativo' source-overrides/client/src/pages/public/CommercialDemo.tsx
  external-http:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testar acesso externo sem cookies ou senha
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const checks = [
            'https://vertice-portal.onrender.com/',
            'https://vertice-portal.onrender.com/demonstracao?perfil=faculdade&bi=1',
            'https://vertice-portal.onrender.com/demonstracao?perfil=universidade&bi=1',
            'https://vertice-portal.onrender.com/bi-demonstrativo'
          ];
          for (const url of checks) {
            let pass = false;
            let last = null;
            for (let attempt=1;attempt<=20;attempt++) {
              try {
                const response=await fetch(url,{redirect:'follow',signal:AbortSignal.timeout(25000)});
                const content=await response.text();
                console.log(JSON.stringify({url,attempt,status:response.status,final:response.url,bytes:content.length,title:content.match(/<title>([^<]+)/i)?.[1]}));
                assert.equal(response.status,200,'Rota pública inacessível: '+url);
                assert.match(response.headers.get('content-type')||'',/text\/html/i);
                assert.match(content,/<html/i);
                assert.ok(!response.url.includes('/entrar'),'Rota pública exige senha');
                pass=true;break;
              } catch(error) {
                last=error;
                if(attempt<20)await new Promise(resolve=>setTimeout(resolve,15000));
              }
            }
            if(!pass)throw last;
          }
          NODE
